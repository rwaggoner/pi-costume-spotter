# Edge app CI: lint + tests. Runs anywhere — no hardware, no secrets — because
# every hardware boundary has a mock adapter (docs/decisions/008-hardware-abstraction.md).
name: ci-edge

on:
  push:
    branches: [main, master]
    paths: ["edge/**", ".github/workflows/ci-edge.yml"]
  pull_request:
    paths: ["edge/**", ".github/workflows/ci-edge.yml"]

jobs:
  test:
    # Windows is a deployment target too (docs/decisions/010-windows-target.md):
    # paths, encodings and subprocess behavior differ there, so test on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # [webcam] + [onnx]: the HOG and ONNX detectors' import paths and decode
      # logic get exercised (the ONNX contract tests skip without a model file).
      - run: pip install -e ".[dev,webcam,onnx]"
      - run: ruff check .
      - run: pytest -q
      - name: Parse the Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem deploy/windows/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Error "$($f.Name): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
